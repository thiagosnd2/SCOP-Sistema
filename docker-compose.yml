services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scop
      POSTGRES_PASSWORD: scop
      POSTGRES_DB: scop
    ports:
      - "5432:5432"
    volumes:
      - scop-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scop"]
      interval: 5s
      retries: 10

volumes:
  scop-db:
